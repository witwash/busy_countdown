[project]
name = "busy-playground"
version = "0.1.0"
description = "Playground and helpers for building custom BUSY Bar apps"
requires-python = ">=3.11"
dependencies = [
    "busylib>=0.1.0",
    "pillow>=10.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busyplay"]
